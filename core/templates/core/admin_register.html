
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Registration | Taxi Booking System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #172033, #344766);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 12px;
            font-family: Arial, sans-serif;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 15px 45px #0003;
        }

        .brand {
            color: #263c60;
            font-weight: 700;
        }

        .form-control {
            padding: 11px;
            border-radius: 8px;
        }

        .btn-register {
            background: #263c60;
            color: white;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-register:hover {
            background: #172033;
            color: white;
        }
    </style>
</head>

<body>
<div class="register-card">

    <div class="text-center mb-4">
        <h2 class="brand">🚕 Taxi Admin</h2>
        <h4 class="mt-3">Create Admin Account</h4>
        <p class="text-muted">Register a new system administrator</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name"
                   class="form-control" maxlength="100"
                   placeholder="Enter full name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username"
                   class="form-control"
                   placeholder="Choose a username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email"
                   class="form-control"
                   placeholder="admin@example.com" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password"
                   class="form-control"
                   placeholder="Create a strong password"
                   autocomplete="new-password" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password"
                   class="form-control"
                   placeholder="Re-enter password"
                   autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-register w-100">
            Register Admin
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'admin_dashboard' %}"
           class="text-decoration-none">
            Back to Dashboard
        </a>
    </div>

</div>
</body>
</html>
