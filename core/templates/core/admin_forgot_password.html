
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | Taxi Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #172033, #344766);
            font-family: Arial, sans-serif;
        }

        .forgot-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px #0003;
        }

        .brand {
            color: #263c60;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .btn-reset {
            background: #263c60;
            color: white;
            padding: 12px;
        }

        .btn-reset:hover {
            background: #172033;
            color: white;
        }
    </style>
</head>

<body>
<div class="forgot-card">

    <div class="text-center mb-4">
        <h2 class="brand">🚕 Taxi Admin</h2>
        <h4 class="mt-3">Forgot Password?</h4>
        <p class="text-muted">
            Enter your admin email address to receive a six-digit reset code.
        </p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
            <label for="email" class="form-label">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="Enter registered email"
                autocomplete="email"
                required
            >
        </div>

        <button type="submit" class="btn btn-reset w-100">
            Send reset code
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'admin_login' %}" class="text-decoration-none">
            ← Back to Admin Login
        </a>
    </div>

</div>
</body>
</html>
