<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit {{ user_record.name }} | Taxi Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            align-items: center;
            background: #f3f6fa;
            display: flex;
            min-height: 100vh;
            padding: 1.5rem 0;
        }
        .edit-card { border: 0; border-radius: 14px; }
        .edit-card input {
            border: 1px solid #ced4da;
            border-radius: .5rem;
            display: block;
            padding: .65rem .75rem;
            width: 100%;
        }
        .edit-card label { font-weight: 600; margin-bottom: .35rem; }
        .edit-card ul.errorlist {
            color: #b02a37;
            font-size: .9rem;
            list-style: none;
            margin: .25rem 0;
            padding: 0;
        }
    </style>
</head>
<body>
<main class="container" style="max-width: 620px;">
    <a class="text-decoration-none" href="{% url 'admin_users' %}">
        &larr; Back to users
    </a>
    <section class="card edit-card shadow-sm mt-3">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold">Edit user</h1>
            <p class="text-secondary mb-4">
                Update {{ user_record.name }}'s contact details.
            </p>

            <form method="POST">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {% for field in form %}
                    <div class="mb-3">
                        {{ field.label_tag }}
                        {{ field }}
                        {{ field.errors }}
                    </div>
                {% endfor %}
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Save changes</button>
                    <a class="btn btn-outline-secondary" href="{% url 'admin_users' %}">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
