<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ user_record.name }} | User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background: #f3f6fa; }
        .admin-navbar { background: #172033; }
        .profile-card { border: 0; border-radius: 14px; }
        .profile-avatar {
            align-items: center;
            background: #e8efff;
            border-radius: 50%;
            color: #24477c;
            display: inline-flex;
            font-size: 1.5rem;
            font-weight: 700;
            height: 72px;
            justify-content: center;
            width: 72px;
        }
        .detail-label {
            color: #64748b;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark admin-navbar">
    <div class="container-xxl">
        <a class="navbar-brand fw-bold" href="{% url 'admin_dashboard' %}">
            🚕 Taxi Admin
        </a>
        <div class="d-flex align-items-center gap-3">
            <a class="nav-link text-white" href="{% url 'admin_users' %}">
                Users
            </a>
            <form method="POST" action="{% url 'admin_logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container-xxl py-4">
    <a class="text-decoration-none small" href="{% url 'admin_users' %}">
        &larr; Back to users
    </a>
    <section class="card profile-card shadow-sm mt-3">
        <div class="card-body p-4 p-md-5">
            <header class="d-flex flex-wrap align-items-center gap-3 mb-4">
                <span class="profile-avatar" aria-hidden="true">
                    {{ user_record.name|first|upper }}
                </span>
                <div>
                    <p class="text-secondary small mb-1">
                        User #{{ user_record.pk }}
                    </p>
                    <h1 class="h3 fw-bold mb-1">{{ user_record.name }}</h1>
                    <p class="text-secondary mb-0">Customer profile</p>
                </div>
                <a class="btn btn-primary ms-md-auto"
                   href="{% url 'admin_user_edit' user_record.pk %}">
                    Edit profile
                </a>
            </header>

            <hr class="mb-4">
            <h2 class="h6 fw-bold mb-3">Contact information</h2>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <div class="detail-label mb-1">Email address</div>
                    <div>{{ user_record.email }}</div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="detail-label mb-1">Mobile number</div>
                    <div>{{ user_record.mobile }}</div>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
