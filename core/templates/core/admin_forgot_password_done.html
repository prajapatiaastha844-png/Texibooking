<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Reset Requested</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="card shadow-sm mx-auto p-4 text-center"
         style="max-width: 500px;">
        <h1 class="h3">Password Reset Requested</h1>
        <p class="text-muted">
            If an eligible admin account matches that email address, a
            verification code has been sent. Check your email or, during local
            development, the terminal.
        </p>
        <a href="{% url 'admin_reset_otp' %}" class="btn btn-primary">
            Enter verification code
        </a>
    </div>
</main>
</body>
</html>
